# Local development dependencies: Postgres + Mailpit (catches every email; UI on http://localhost:8025).
#   docker compose -f deploy/compose.dev.yml up -d
name: illiria-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: illiria
      POSTGRES_USER: illiria
      POSTGRES_PASSWORD: illiria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: {}
